name: "Test Report"
on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

permissions: {}

jobs:
  summary:
    name: "Report summary"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    outputs:
      passed: ${{ steps.report.outputs.passed }}
      failed: ${{ steps.report.outputs.failed }}
      skipped: ${{ steps.report.outputs.skipped }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦Download artifacts (all junit-report-*)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: junit-report
          pattern: junit-report-*
          merge-multiple: true

      - name: 🔬Report summary
        id: report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: "🔬Bats JUnit report"
          path: "junit-report/**/*.xml"
          reporter: java-junit

  badge:
    name: "Publish badge (main only)"
    needs: summary
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Shields endpoint JSON (passed/failed/skipped)
        env:
          PASSED: ${{ needs.summary.outputs.passed }}
          FAILED: ${{ needs.summary.outputs.failed }}
          SKIPPED: ${{ needs.summary.outputs.skipped }}
        run: |
          set -euo pipefail

          passed="${PASSED:-0}"
          failed="${FAILED:-0}"
          skipped="${SKIPPED:-0}"

          for count in "$passed" "$failed" "$skipped"; do
            if [[ ! "$count" =~ ^[0-9]+$ ]]; then
              echo "Unexpected non-numeric test count: '$count'" >&2
              exit 1
            fi
          done

          if [[ "$failed" != "0" ]]; then
            color="red"
            message="${passed} passed, ${failed} failed"
          elif [[ "$skipped" != "0" ]]; then
            color="yellow"
            message="${passed} passed, ${skipped} skipped"
          else
            color="brightgreen"
            message="${passed} passed"
          fi

          mkdir -p public
          cat > public/tests.json <<JSON
          {
            "schemaVersion": 1,
            "label": "bats tests",
            "message": "${message}",
            "color": "${color}"
          }
          JSON

          echo "Badge JSON:"
          cat public/tests.json

      - name: Publish badge to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: true

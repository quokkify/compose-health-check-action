name: "Compose DevOps Healthcheck"
description: "Runs docker compose and validates container health"
author: "Yaraslau Lazakovich"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  compose-files:
    description: "List of docker-compose files (one per line)"
    required: true
    default: |
      docker-compose.yml
  compose-services:
    description: "List of services to check (space-separated). Defaults to all services when omitted; ignored when docker-command is set."
    required: false
    default: ""
  services:
    description: "DEPRECATED: use compose-services."
    required: false
    default: ""
  timeout:
    description: "Healthcheck timeout per service in seconds"
    required: false
    default: "120"
  log-lines:
    description: "Number of healthcheck/container log lines to show on failure"
    required: false
    default: "25"
  additional-compose-args:
    description: "Additional args for docker compose (e.g. --quiet-pull or --build)"
    required: false
    default: ""
  compose-profiles:
    description: "One or more compose profiles (space or newline separated). Ignored when docker-command is set."
    required: false
    default: ""
  before-compose-hook:
    description: "Optional repository-relative Bash file sourced before docker compose; receives compose profiles as arguments and may export Compose interpolation variables."
    required: false
    default: ""
  after-health-hook:
    description: "Optional repository-relative Bash file sourced after built-in container health checks; receives compose profiles as arguments and may perform project-specific readiness checks."
    required: false
    default: ""
  docker-command:
    description: "Full docker compose command to execute instead of compose-files/services (e.g. docker compose -f docker-compose.yml up -d web)"
    required: false
    default: ""
  compose-project-name:
    description: "Explicit docker compose project name (overridden by -p/--project-name in docker-command)."
    required: false
    default: ""
  auto-apply-project-name:
    description: "When true, resolve and export COMPOSE_PROJECT_NAME and write it to project-name-env-file."
    required: false
    default: "false"
  project-name-env-file:
    description: "Env file path to write COMPOSE_PROJECT_NAME when auto-apply-project-name is enabled."
    required: false
    default: "system.env"
  report-format:
    description: "Healthcheck report format: text | json | both"
    required: false
    default: "text"

outputs:
  summary_b64:
    description: "Base64-encoded human-readable output of healthcheck"
    value: ${{ steps.run_healthcheck.outputs.summary_b64 }}
  report_json_b64:
    description: "Base64-encoded machine-readable JSON healthcheck report (when enabled)"
    value: ${{ steps.run_healthcheck.outputs.report_json_b64 }}

runs:
  using: "composite"
  steps:
    - id: run_healthcheck
      name: Run docker compose with health check
      shell: bash
      env:
        DOCKER_HEALTH_TIMEOUT: ${{ inputs.timeout }}
        DOCKER_HEALTH_LOG_LINES: ${{ inputs.log-lines }}
        DOCKER_SERVICES_LIST: ${{ inputs.compose-services }}
        DOCKER_HEALTH_REPORT_FORMAT: ${{ inputs.report-format }}
        DOCKER_HEALTH_PROJECT_NAME_INPUT: ${{ inputs.compose-project-name }}
        DOCKER_HEALTH_AUTO_APPLY_PROJECT_NAME: ${{ inputs.auto-apply-project-name }}
        DOCKER_HEALTH_PROJECT_ENV_FILE: ${{ inputs.project-name-env-file }}
        COMPOSE_FILES_INPUT: ${{ inputs.compose-files }}
        ADDITIONAL_COMPOSE_ARGS_INPUT: ${{ inputs.additional-compose-args }}
        SERVICES_INPUT: ${{ inputs.services }}
        COMPOSE_SERVICES_INPUT: ${{ inputs.compose-services }}
        REPORT_FORMAT_INPUT: ${{ inputs.report-format }}
        DOCKER_COMMAND_INPUT: ${{ inputs.docker-command }}
        COMPOSE_PROFILES_INPUT: ${{ inputs.compose-profiles }}
        BEFORE_COMPOSE_HOOK_INPUT: ${{ inputs.before-compose-hook }}
        AFTER_HEALTH_HOOK_INPUT: ${{ inputs.after-health-hook }}
      run: |
        set -euo pipefail

        SCRIPT_DIR="${GITHUB_ACTION_PATH}"

        compose_files_input="${COMPOSE_FILES_INPUT}"
        additional_args_input="${ADDITIONAL_COMPOSE_ARGS_INPUT}"
        services_input="${SERVICES_INPUT}"
        compose_services_input="${COMPOSE_SERVICES_INPUT}"
        report_format_input="${REPORT_FORMAT_INPUT}"
        docker_command_input="${DOCKER_COMMAND_INPUT}"
        compose_profiles_input="${COMPOSE_PROFILES_INPUT}"
        before_compose_hook_input="${BEFORE_COMPOSE_HOOK_INPUT}"
        after_health_hook_input="${AFTER_HEALTH_HOOK_INPUT}"

        services_to_use="$compose_services_input"
        if [[ -z "$services_to_use" ]]; then
          services_to_use="$services_input"
        fi

        if [[ -n "$services_to_use" ]]; then
          export DOCKER_SERVICES_LIST="$services_to_use"
        fi

        if [[ -n "$docker_command_input" ]]; then
          unset DOCKER_SERVICES_LIST
        fi

        mapfile -d '' -t CMD < <(
          COMPOSE_FILES_INPUT="$compose_files_input" \
          ADDITIONAL_COMPOSE_ARGS_INPUT="$additional_args_input" \
          COMPOSE_SERVICES_INPUT="$compose_services_input" \
          SERVICES_INPUT="$services_input" \
          COMPOSE_PROFILES_INPUT="$compose_profiles_input" \
          DOCKER_COMMAND_INPUT="$docker_command_input" \
          bash "${SCRIPT_DIR}/lib/build-compose-command.sh"
        )

        TMP_OUT="$(mktemp)"
        JSON_TMP="$(mktemp)"

        # Tell the healthcheck script where to write JSON (if report-format is json/both).
        export DOCKER_HEALTH_REPORT_JSON_FILE="$JSON_TMP"
        export DOCKER_HEALTH_REPORT_FORMAT="$report_format_input"

        run_hook() {
          local hook_name="$1"
          local hook_input="$2"
          [[ -n "$hook_input" ]] || return 0

          local resolved_hook
          resolved_hook="$(bash "${SCRIPT_DIR}/lib/resolve-lifecycle-hook.sh" "$hook_input" "${GITHUB_WORKSPACE:-}" "$hook_name")"

          local -a hook_profiles=()
          if [[ -z "$docker_command_input" && -n "$compose_profiles_input" ]]; then
            read -r -a hook_profiles <<<"$(tr '\n' ' ' <<<"$compose_profiles_input")"
          fi

          echo "Running $hook_name: $hook_input"
          # Hooks are repository-owned code. Source them so before-compose exports
          # remain available to Docker Compose interpolation in this lifecycle.
          # Reset positional parameters first: `source file` with no explicit
          # arguments would otherwise leak run_hook's own name/path arguments.
          set -- "${hook_profiles[@]}"
          source "$resolved_hook" "$@"
        }

        run_lifecycle() {
          run_hook "before-compose-hook" "$before_compose_hook_input" || return $?
          bash "${SCRIPT_DIR}/entrypoint.sh" "${CMD[@]}" || return $?
          run_hook "after-health-hook" "$after_health_hook_input" || return $?
        }

        set +e
        run_lifecycle 2>&1 | tee "$TMP_OUT"
        lifecycle_status=("${PIPESTATUS[@]}")
        set -e
        rc="${lifecycle_status[0]}"

        OUTPUT_B64="$(base64 <"$TMP_OUT" | tr -d '\n')"
        echo "summary_b64=$OUTPUT_B64" >>"$GITHUB_OUTPUT"

        # JSON describes the complete lifecycle only when Compose and both hooks pass.
        if [[ "$rc" -eq 0 && -s "$JSON_TMP" ]]; then
          JSON_B64="$(base64 <"$JSON_TMP" | tr -d '\n')"
          echo "report_json_b64=$JSON_B64" >>"$GITHUB_OUTPUT"
        else
          echo "report_json_b64=" >>"$GITHUB_OUTPUT"
        fi

        rm -f "$TMP_OUT" "$JSON_TMP"
        exit "$rc"

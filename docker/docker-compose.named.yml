name: customproject

services:
  web:
    image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    stop_grace_period: 1s
    command: >
      sh -c "
        echo 'web started';
        touch /tmp/web_ready;
        exec tail -f /dev/null
      "
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/web_ready"]
      interval: 200ms
      timeout: 200ms
      retries: 20
      start_period: 0s

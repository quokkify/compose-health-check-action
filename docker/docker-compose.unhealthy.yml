services:
  slow-broken:
    image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    stop_grace_period: 1s
    command:
      [
        "sh",
        "-c",
        "echo 'Starting slow-broken (simulated unhealthy)...'; exec tail -f /dev/null",
      ]
    healthcheck:
      test: ["CMD-SHELL", "echo 'still broken' >&2; exit 1"]
      interval: 200ms
      timeout: 200ms
      retries: 10
      start_period: 0s
